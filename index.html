<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Todo List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/cleanup.css">
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <h1>Mis Tareas</h1>
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Añadir nueva tarea...">
            <button id="add-btn">Añadir</button>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendientes</button>
            <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>
        <ul id="todo-list"></ul>
        <div class="footer">
            <span id="task-count">0 tareas pendientes</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
